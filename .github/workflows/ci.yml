name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # Node 20 LTS: recommended runtime for Next.js 15 (Node 22 has a
          # Windows-only child_process.kill EPERM regression that breaks
          # `next build` locally; CI is Linux, but keep versions consistent).
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        # Hermetic: no network, no secrets (E2E suite is excluded by design).
        run: npm test

      - name: Build
        run: npm run build
